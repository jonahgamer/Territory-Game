<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in · Territory Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <section class="login-screen">
    <div class="login-card">
      <p class="eyebrow">Territory Game</p>
      <h1>Log in</h1>
      <p class="lead">Use the username and password from the server.</p>
      <form id="login-form" class="problem-editor">
        <label>Username <input id="login-username" type="text" autocomplete="username" required /></label>
        <label>Password <input id="login-password" type="password" autocomplete="current-password" required /></label>
        <button id="login-submit" type="submit">Log in</button>
        <p id="login-error" class="form-error" hidden></p>
      </form>
    </div>
  </section>
  <script type="module" src="/app/login.js"></script>
</body>
</html>
