<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard · Territory Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css?v=score-scroll3" />
</head>
<body>
  <div class="app">
    <header class="mobile-bar">
      <a id="mobile-home" class="brand mobile-logo" href="/index.html">Puzzle Territory</a>
      <button id="menu-button" class="menu-button" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
        <span class="menu-bars" aria-hidden="true"></span>Menu
      </button>
    </header>
    <aside class="sidebar">
      <a class="brand" id="home-button" href="/index.html">Puzzle Territory</a>
      <nav id="site-nav" aria-label="Sections"><ul id="nav-list"></ul></nav>
      <div class="account">
        <img id="account-pfp" class="account-pfp" alt="" hidden />
        <p id="account-name" hidden></p>
        <button id="account-button" type="button">Log out</button>
        <p id="account-role"></p>
      </div>
    </aside>
    <button class="sidebar-backdrop" type="button" aria-label="Close menu" hidden></button>
    <main>
      <p id="load-error" class="form-error" hidden></p>
      <div class="editor-toolbar">
        <a class="back-button" id="back-to-contest" href="/play.html">Back to the contest</a>
      </div>
      <p class="eyebrow">Contest</p>
      <h1 id="leaderboard-title">Leaderboard</h1>
      <p id="leaderboard-note" class="field-note"></p>
      <p id="leaderboard-empty" class="field-note" hidden>No scores yet.</p>
      <div id="leaderboard-list" class="score-grid-wrap" hidden></div>
    </main>
  </div>
  <script type="module" src="/app/contest-leaderboard.js?v=poll-slow"></script>
</body>
</html>
