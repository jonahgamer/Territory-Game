<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice · 260xx</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" crossorigin="anonymous" />
    <style>
      .cat-section { margin-top: 32px; }
      .cat-section h2 {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin: 0 0 12px;
      }
      .cat-section h2 .cat-tag {
        font-family: var(--font-ui);
        font-size: 13px;
        letter-spacing: 0.08em;
        color: var(--cyan);
      }
      .cat-section h2 .cat-count {
        font-family: var(--font-ui);
        font-size: 13px;
        color: var(--muted);
      }
      .cat-grid {
        display: grid;
        gap: 18px;
        grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
      }
      .cat-empty {
        margin: 0;
        color: var(--muted);
        font-family: var(--font-ui);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main class="practice" style="max-width:56rem;margin:0 auto;padding:24px 16px 64px;">
      <p class="eyebrow">Practice</p>
      <h1>260xx Problems</h1>
      <p class="lead">Guests can view and submit. Answers are checked by the saved grader; nothing is written to the database.</p>

      <ul class="legend">
        <li><span class="swatch fill easy"></span>Easy</li>
        <li><span class="swatch fill normal"></span>Normal</li>
        <li><span class="swatch fill hard"></span>Hard</li>
        <li><span class="swatch fill insane"></span>Insane</li>
      </ul>

      <p id="practice-error" class="form-error" hidden></p>

      <section class="cat-section" data-cat="M">
        <h2>Math <span class="cat-tag">M</span><span class="cat-count"></span></h2>
        <div class="cat-grid" aria-live="polite"></div>
        <p class="cat-empty" hidden>No Math problems.</p>
      </section>

      <section class="cat-section" data-cat="O">
        <h2>OI <span class="cat-tag">O</span><span class="cat-count"></span></h2>
        <div class="cat-grid" aria-live="polite"></div>
        <p class="cat-empty" hidden>No OI problems.</p>
      </section>

      <section class="cat-section" data-cat="P">
        <h2>Puzzle <span class="cat-tag">P</span><span class="cat-count"></span></h2>
        <div class="cat-grid" aria-live="polite"></div>
        <p class="cat-empty" hidden>No Puzzle problems.</p>
      </section>

      <section class="cat-section" data-cat="S">
        <h2>Science <span class="cat-tag">S</span><span class="cat-count"></span></h2>
        <div class="cat-grid" aria-live="polite"></div>
        <p class="cat-empty" hidden>No Science problems.</p>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
    <script>
      (function () {
        "use strict";

        var API_BASE = "/api/territory";
        var DIFFICULTY_NAME = { easy: "Easy", normal: "Normal", hard: "Hard", insane: "Insane" };
        var DIFFICULTY_SCORE = { easy: 1, normal: 2, hard: 3, insane: 4 };
        var TYPE_TAG = { math: "M", oi: "O", science: "S", puzzle: "P", testing: "T" };
        var SECTIONS = [
          { cat: "M", type: "math" },
          { cat: "O", type: "oi" },
          { cat: "P", type: "puzzle" },
          { cat: "S", type: "science" },
        ];

        var errorEl = document.getElementById("practice-error");

        function tagOf(p) { return (TYPE_TAG[p.type] || "?") + p.index; }

        function plainText(source) {
          return String(source || "")
            .replace(/<script[\s\S]*?<\/script>/gi, " ")
            .replace(/<style[\s\S]*?<\/style>/gi, " ")
            .replace(/<[^>]*>/g, " ")
            .replace(/&nbsp;/gi, " ")
            .replace(/\s+/g, " ")
            .trim();
        }

        function card(problem) {
          var level = DIFFICULTY_NAME[problem.difficulty] ? problem.difficulty : "normal";
          var link = document.createElement("a");
          link.href = "/testing/problem.html?index=" + problem.index + "&type=" + encodeURIComponent(problem.type);
          link.target = "_blank";
          link.rel = "noopener";
          link.style.cssText = "display:flex;flex-direction:column;gap:10px;padding:14px 16px;border:1px solid var(--line);background:#101820;color:var(--ink);text-align:left;text-decoration:none;cursor:pointer;";
          link.setAttribute("aria-label", "Open " + tagOf(problem) + " in a new tab");

          var tag = document.createElement("span");
          tag.style.cssText = "font-family:var(--font-ui);font-size:18px;font-weight:700;letter-spacing:.04em;";
          tag.textContent = tagOf(problem);

          var diff = document.createElement("span");
          diff.style.cssText = "align-self:flex-start;padding:2px 7px;border:1px solid currentColor;font-family:var(--font-ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;";
          diff.textContent = DIFFICULTY_NAME[level] + " · " + DIFFICULTY_SCORE[level];

          var preview = document.createElement("span");
          preview.style.cssText = "font-family:var(--font-ui);font-size:13px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;";
          preview.textContent = plainText(problem.prompt) || "(empty)";

          link.append(tag, diff, preview);
          return link;
        }

        function renderSections(problems) {
          for (var i = 0; i < SECTIONS.length; i += 1) {
            var section = SECTIONS[i];
            var sectionEl = document.querySelector('.cat-section[data-cat="' + section.cat + '"]');
            if (!sectionEl) continue;
            var gridEl = sectionEl.querySelector(".cat-grid");
            var emptyEl = sectionEl.querySelector(".cat-empty");
            var countEl = sectionEl.querySelector(".cat-count");
            gridEl.replaceChildren();

            var items = problems.filter(function (p) { return p.type === section.type; });
            items.sort(function (a, b) { return a.index - b.index; });

            countEl.textContent = items.length ? "(" + items.length + ")" : "";
            emptyEl.hidden = items.length > 0;
            for (var j = 0; j < items.length; j += 1) gridEl.append(card(items[j]));
          }
        }

        async function load() {
          errorEl.hidden = true;
          try {
            var res = await fetch(API_BASE + "?action=public-problems", { method: "GET" });
            var data = await res.json().catch(function () { return {}; });
            if (!res.ok) throw new Error(data.message || ("HTTP " + res.status));
            renderSections(Array.isArray(data.problems) ? data.problems : []);
          } catch (error) {
            errorEl.hidden = false;
            errorEl.textContent = error.message || "Could not load problems.";
          }
        }

        load();
      })();
    </script>
  </body>
</html>
