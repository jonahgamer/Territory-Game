<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Territory Game - Testing Problems</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" crossorigin="anonymous" />
    <style>
      .cat-grid {
        display: grid;
        gap: 18px;
        grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
      }
      .cat-empty {
        margin: 0;
        color: var(--muted);
        font-family: var(--font-ui);
        font-size: 13px;
      }
      /* Difficulty accent on the card. */
      .practice-card {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-left-width: 6px;
        background: #101820;
        color: var(--ink);
        text-align: left;
        text-decoration: none;
        cursor: pointer;
      }
      .practice-card.easy   { border-left-color: #3ddc6a; }
      .practice-card.normal { border-left-color: #ffe14a; }
      .practice-card.hard   { border-left-color: #ff3b4e; }
      .practice-card.insane { border-left-color: #c084fc; }
      .practice-card:hover { outline: 2px solid var(--cyan); outline-offset: -4px; }
      .practice-card .tag {
        font-family: var(--font-ui);
        font-size: 18px;
        font-weight: 700;
        letter-spacing: .04em;
      }
      .practice-card .preview {
        font-family: var(--font-ui);
        font-size: 13px;
        color: var(--muted);
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
      }
    </style>
  </head>
  <body>
    <main class="practice" style="max-width:56rem;margin:0 auto;padding:24px 16px 64px;">
      <p class="eyebrow">Practice</p>
      <h1>Testing Problems</h1>

      <div class="kind-choices" id="practice-categories" role="group" aria-label="Choose a category" style="margin:16px 0;">
        <button type="button" data-cat="M" aria-pressed="false">Math (M)</button>
        <button type="button" data-cat="O" aria-pressed="false">OI (O)</button>
        <button type="button" data-cat="P" aria-pressed="false">Puzzle (P)</button>
        <button type="button" data-cat="S" aria-pressed="false">Science (S)</button>
      </div>

      <ul class="legend">
        <li><span class="swatch fill easy"></span>Easy</li>
        <li><span class="swatch fill normal"></span>Normal</li>
        <li><span class="swatch fill hard"></span>Hard</li>
        <li><span class="swatch fill insane"></span>Insane</li>
      </ul>

      <p id="practice-error" class="form-error" hidden></p>
      <p id="practice-hint" class="field-note">Choose a category above to see its problems.</p>
      <p id="practice-empty" class="field-note" hidden>No problems in this category.</p>
      <div id="practice-grid" class="cat-grid" aria-live="polite"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
    <script>
      (function () {
        "use strict";

        var API_BASE = "/api/territory";
        var DIFFICULTY_NAME = { easy: "Easy", normal: "Normal", hard: "Hard", insane: "Insane" };
        var DIFFICULTY_SCORE = { easy: 1, normal: 2, hard: 3, insane: 4 };
        var TYPE_TAG = { math: "M", oi: "O", science: "S", puzzle: "P", testing: "T" };
        var TAG_TO_TYPE = { M: "math", O: "oi", S: "science", P: "puzzle" };

        var grid = document.getElementById("practice-grid");
        var errorEl = document.getElementById("practice-error");
        var emptyEl = document.getElementById("practice-empty");
        var hintEl = document.getElementById("practice-hint");
        var categoryBar = document.getElementById("practice-categories");

        var allProblems = [];
        var activeCat = null;

        function tagOf(p) { return (TYPE_TAG[p.type] || "?") + p.index; }

        function plainText(source) {
          return String(source || "")
            .replace(/<script[\s\S]*?<\/script>/gi, " ")
            .replace(/<style[\s\S]*?<\/style>/gi, " ")
            .replace(/<[^>]*>/g, " ")
            .replace(/&nbsp;/gi, " ")
            .replace(/\s+/g, " ")
            .trim();
        }

        function card(problem) {
          var level = DIFFICULTY_NAME[problem.difficulty] ? problem.difficulty : "normal";
          var link = document.createElement("a");
          link.href = "/testing/problem.html?index=" + problem.index + "&type=" + encodeURIComponent(problem.type);
          link.target = "_blank";
          link.rel = "noopener";
          // Difficulty is carried by the card border color (class), matching
          // the legend swatches in style.css.
          link.className = "practice-card " + level;
          link.setAttribute("aria-label", tagOf(problem) + ", " + DIFFICULTY_NAME[level] + ", open in a new tab");

          var tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = tagOf(problem);

          // Reuse the shared difficulty chip styling from style.css.
          var diff = document.createElement("span");
          diff.className = "difficulty-chip " + level;
          diff.textContent = DIFFICULTY_NAME[level] + " · " + DIFFICULTY_SCORE[level];

          var preview = document.createElement("span");
          preview.className = "preview";
          preview.textContent = plainText(problem.prompt) || "(empty)";

          link.append(tag, diff, preview);
          return link;
        }

        function render() {
          grid.replaceChildren();
          emptyEl.hidden = true;
          hintEl.hidden = true;
          if (!activeCat) {
            hintEl.hidden = false;
            return;
          }
          var type = TAG_TO_TYPE[activeCat];
          var items = allProblems.filter(function (p) { return p.type === type; });
          items.sort(function (a, b) { return a.index - b.index; });
          if (items.length === 0) { emptyEl.hidden = false; return; }
          for (var i = 0; i < items.length; i += 1) grid.append(card(items[i]));
        }

        function syncButtons() {
          var buttons = categoryBar.querySelectorAll("[data-cat]");
          for (var i = 0; i < buttons.length; i += 1) {
            buttons[i].setAttribute("aria-pressed", String(buttons[i].dataset.cat === activeCat));
          }
        }

        categoryBar.addEventListener("click", function (event) {
          var button = event.target.closest("[data-cat]");
          if (!button) return;
          var cat = button.dataset.cat;
          activeCat = activeCat === cat ? null : cat;
          syncButtons();
          render();
        });

        async function load() {
          errorEl.hidden = true;
          try {
            var res = await fetch(API_BASE + "?action=public-problems", { method: "GET" });
            var data = await res.json().catch(function () { return {}; });
            if (!res.ok) throw new Error(data.message || ("HTTP " + res.status));
            allProblems = Array.isArray(data.problems) ? data.problems : [];
            render();
          } catch (error) {
            errorEl.hidden = false;
            errorEl.textContent = error.message || "Could not load problems.";
          }
        }

        syncButtons();
        load();
      })();
    </script>
  </body>
</html>
