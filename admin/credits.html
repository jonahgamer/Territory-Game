<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Credits · Territory Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <header class="mobile-bar">
      <a id="mobile-home" class="brand mobile-logo" href="/admin/credits.html">Puzzle Territory</a>
      <button id="menu-button" class="menu-button" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
        <span class="menu-bars" aria-hidden="true"></span>Menu
      </button>
    </header>
    <aside class="sidebar">
      <a class="brand" id="home-button" href="/admin/maps.html">Puzzle Territory</a>
      <nav id="site-nav" aria-label="Sections"><ul id="nav-list"></ul></nav>
      <div class="account">
        <img id="account-pfp" class="account-pfp" alt="" hidden />
        <p id="account-name" hidden></p>
        <button id="account-button" type="button">Log out</button>
        <p id="account-role"></p>
      </div>
    </aside>
    <button class="sidebar-backdrop" type="button" aria-label="Close menu" hidden></button>
    <main>
      <p class="eyebrow">Changelog</p>
      <h1>Credits</h1>
      <p class="lead">Version history and release notes.</p>

      <form id="version-form" class="create-map">
        <label>Version <input id="version-name" type="text" maxlength="40" required /></label>
        <label>Message <textarea id="version-message" rows="4" maxlength="4000" required></textarea></label>
        <button type="submit">Add version</button>
        <p id="version-form-error" class="form-error" hidden></p>
      </form>

      <p id="version-empty">No versions yet.</p>
      <ul id="version-list" class="version-list" hidden></ul>
    </main>
  </div>
  <div id="page-toast" class="page-toast" role="status" aria-live="polite" hidden>
    <p id="page-toast-message"></p>
    <button id="page-toast-close" type="button">Close</button>
  </div>
  <script type="module" src="/app/admin-credits.js"></script>
</body>
</html>
