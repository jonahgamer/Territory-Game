<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Problem editor · Territory Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" crossorigin="anonymous" />
</head>
<body>
  <div class="app">
    <header class="mobile-bar">
      <a id="mobile-home" class="brand mobile-logo" href="/admin/problems.html">Puzzle Territory</a>
      <button id="menu-button" class="menu-button" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
        <span class="menu-bars" aria-hidden="true"></span>Menu
      </button>
    </header>
    <aside class="sidebar">
      <a class="brand" id="home-button" href="/admin/maps.html">Puzzle Territory</a>
      <nav id="site-nav" aria-label="Sections"><ul id="nav-list"></ul></nav>
      <div class="account">
        <img id="account-pfp" class="account-pfp" alt="" hidden />
        <p id="account-name" hidden></p>
        <button id="account-button" type="button">Log out</button>
        <p id="account-role"></p>
      </div>
    </aside>
    <button class="sidebar-backdrop" type="button" aria-label="Close menu" hidden></button>
    <main>
      <p id="load-error" class="form-error" hidden></p>
      <div class="editor-toolbar">
        <a class="back-button" id="problem-back-button" href="/admin/problems.html">Back to problems</a>
        <div class="editor-toolbar-actions">
          <span id="problem-save-state" class="problem-save-state"></span>
          <button class="save-changes" id="save-problem-top" type="button" disabled>Save</button>
          <button class="account-action" id="duplicate-open-problem" type="button">Duplicate</button>
          <button class="delete-map" id="delete-open-problem" type="button">Delete</button>
        </div>
      </div>
      <p class="eyebrow">Problem editor</p>
      <h1 id="problem-editor-title"></h1>
      <p id="problem-usage" class="field-note"></p>

      <form id="problem-editor-form" class="problem-editor">
        <div id="problem-index-field">
          <label>Index <input id="problem-index-input" type="number" min="1" max="99999" /></label>
          <p id="problem-index-note" class="field-note">Leave a problem to apply this index.</p>
          <p id="problem-index-error" class="form-error" hidden></p>
        </div>

        <div class="kind-choices" id="problem-type-choices" role="group" aria-label="Problem type">
          <button type="button" data-problem-type="math" aria-pressed="false">Math</button>
          <button type="button" data-problem-type="oi" aria-pressed="false">OI</button>
          <button type="button" data-problem-type="science" aria-pressed="false">Science</button>
          <button type="button" data-problem-type="puzzle" aria-pressed="false">Puzzle</button>
          <button type="button" data-problem-type="testing" aria-pressed="false">Testing</button>
        </div>

        <div class="kind-choices" id="problem-difficulty-choices" role="group" aria-label="Difficulty">
          <button type="button" data-problem-difficulty="easy" aria-pressed="false">Easy</button>
          <button type="button" data-problem-difficulty="normal" aria-pressed="true">Normal</button>
          <button type="button" data-problem-difficulty="hard" aria-pressed="false">Hard</button>
          <button type="button" data-problem-difficulty="insane" aria-pressed="false">Insane</button>
        </div>

        <label>Prompt (HTML allowed)
          <textarea id="problem-prompt" rows="10"></textarea>
        </label>
        <label>Answer
          <textarea id="problem-answer" rows="4"></textarea>
        </label>
        <label>Logic (optional, runs in server sandbox)
          <textarea id="problem-logic" rows="10" spellcheck="false"></textarea>
        </label>

        <p id="problem-save-error" class="form-error" hidden></p>
        <button class="save-changes" id="save-problem-button" type="submit" disabled>Save problem</button>
      </form>
    </main>
  </div>
  <div id="page-toast" class="page-toast" role="status" aria-live="polite" hidden>
    <p id="page-toast-message"></p>
    <button id="page-toast-close" type="button">Close</button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
  <script type="module" src="/app/admin-problem-editor.js"></script>
</body>
</html>
