<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hidden rules · Territory Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css?v=hidden-rules" />
</head>
<body>
  <div class="app">
    <header class="mobile-bar">
      <a id="mobile-home" class="brand mobile-logo" href="/admin/maps.html">Puzzle Territory</a>
      <button id="menu-button" class="menu-button" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
        <span class="menu-bars" aria-hidden="true"></span>Menu
      </button>
    </header>
    <aside class="sidebar">
      <a class="brand" id="home-button" href="/admin/maps.html">Puzzle Territory</a>
      <nav id="site-nav" aria-label="Sections"><ul id="nav-list"></ul></nav>
      <div class="account">
        <img id="account-pfp" class="account-pfp" alt="" hidden />
        <p id="account-name" hidden></p>
        <button id="account-button" type="button">Log out</button>
        <p id="account-role"></p>
      </div>
    </aside>
    <button class="sidebar-backdrop" type="button" aria-label="Close menu" hidden></button>
    <main>
      <p id="load-error" class="form-error" hidden></p>
      <p class="eyebrow">Contest</p>
      <h1>Hidden rules</h1>
      <p class="lead">These rules are written in the program. This page lists them. It cannot add or edit them. On a contest, choose which rules apply and when contestants see them.</p>
      <p id="rule-empty">No hidden rules yet.</p>
      <ul id="rule-list" class="version-list" hidden></ul>
    </main>
  </div>
  <script type="module" src="/app/admin-hidden-rules.js?v=hidden-score"></script>
</body>
</html>
