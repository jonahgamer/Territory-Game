<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload problems · Territory Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    .drop-zone {
      margin: 1.25rem 0;
      padding: 2rem 1.25rem;
      border: 2px dashed var(--border, rgba(140, 160, 190, 0.45));
      border-radius: 14px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }
    .drop-zone.is-dragging {
      border-color: var(--accent, #4cc9f0);
      background: rgba(76, 201, 240, 0.08);
    }
    .drop-zone-title {
      margin: 0 0 0.35rem;
      font-family: "Orbitron", sans-serif;
      font-size: 1.1rem;
    }
    .drop-zone-hint { margin: 0 0 0.9rem; opacity: 0.7; }
    .drop-zone-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .upload-count { opacity: 0.8; font-family: "Share Tech Mono", monospace; }
    .upload-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.75rem 1rem;
      align-items: center;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border, rgba(140, 160, 190, 0.25));
    }
    .upload-tag {
      font-family: "Share Tech Mono", monospace;
      font-size: 1rem;
    }
    .upload-files {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      font-family: "Share Tech Mono", monospace;
      font-size: 0.85rem;
    }
    .upload-file {
      padding: 0.1rem 0.5rem;
      border: 1px solid var(--border, rgba(140, 160, 190, 0.4));
      border-radius: 999px;
    }
    .upload-file.is-ok { border-color: var(--ok, #4ade80); }
    .upload-file.is-missing { border-style: dashed; opacity: 0.45; }
    @media (max-width: 640px) {
      .upload-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="mobile-bar">
      <a id="mobile-home" class="brand mobile-logo" href="/admin/problems.html">Puzzle Territory</a>
      <button id="menu-button" class="menu-button" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
        <span class="menu-bars" aria-hidden="true"></span>Menu
      </button>
    </header>
    <aside class="sidebar">
      <a class="brand" id="home-button" href="/admin/maps.html">Puzzle Territory</a>
      <nav id="site-nav" aria-label="Sections"><ul id="nav-list"></ul></nav>
      <div class="account">
        <img id="account-pfp" class="account-pfp" alt="" hidden />
        <p id="account-name" hidden></p>
        <button id="account-button" type="button">Log out</button>
        <p id="account-role"></p>
      </div>
    </aside>
    <button class="sidebar-backdrop" type="button" aria-label="Close menu" hidden></button>
    <main>
      <p id="load-error" class="form-error" hidden></p>
      <div class="editor-toolbar">
        <a class="back-button" id="upload-back" href="/admin/problems.html">Back to problems</a>
        <div class="editor-toolbar-actions">
          <button class="account-action" id="upload-clear" type="button">Clear all</button>
          <button class="save-changes" id="upload-save" type="button">Save all</button>
        </div>
      </div>
      <p class="eyebrow">Batch</p>
      <h1 id="upload-title">Upload problems</h1>
      <p class="lead">
        Drop files named <code>P&lt;number&gt;.pro</code> (statement), <code>P&lt;number&gt;.ans</code> (answer)
        and optionally <code>P&lt;number&gt;.gra</code> (grader). Files that share a number are grouped into one problem.
      </p>
      <p id="upload-error" class="form-error" hidden></p>

      <div class="drop-zone" id="drop-zone">
        <p class="drop-zone-title">Drop files here</p>
        <p class="drop-zone-hint">.pro · .ans · .gra</p>
        <div class="drop-zone-actions">
          <button class="account-action" id="pick-files" type="button">Choose files</button>
          <button class="account-action" id="pick-folder" type="button">Choose folder</button>
        </div>
        <input id="file-input" type="file" multiple accept=".pro,.ans,.gra" hidden />
        <input id="folder-input" type="file" webkitdirectory multiple hidden />
      </div>

      <p id="upload-count" class="upload-count" hidden></p>
      <div class="batch-rows" id="upload-list"></div>
    </main>
  </div>
  <div id="page-toast" class="page-toast" role="status" aria-live="polite" hidden>
    <p id="page-toast-message"></p>
    <button id="page-toast-close" type="button">Close</button>
  </div>
  <script type="module" src="/app/admin-problem-upload.js?v=page-data"></script>
</body>
</html>
