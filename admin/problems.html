<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Problems · Territory Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" crossorigin="anonymous" />
</head>
<body>
  <div class="app">
    <header class="mobile-bar">
      <a id="mobile-home" class="brand mobile-logo" href="/admin/problems.html">Puzzle Territory</a>
      <button id="menu-button" class="menu-button" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
        <span class="menu-bars" aria-hidden="true"></span>Menu
      </button>
    </header>
    <aside class="sidebar">
      <a class="brand" id="home-button" href="/admin/maps.html">Puzzle Territory</a>
      <nav id="site-nav" aria-label="Sections"><ul id="nav-list"></ul></nav>
      <div class="account">
        <img id="account-pfp" class="account-pfp" alt="" hidden />
        <p id="account-name" hidden></p>
        <button id="account-button" type="button">Log out</button>
        <p id="account-role"></p>
      </div>
    </aside>
    <button class="sidebar-backdrop" type="button" aria-label="Close menu" hidden></button>
    <main>
      <p id="load-error" class="form-error" hidden></p>
      <p class="eyebrow">Admin</p>
      <h1>Problems</h1>
      <p class="lead">Browse and edit problems by type.</p>

      <div class="kind-choices" id="problem-section-choices" role="group" aria-label="Problem type">
        <button type="button" data-section="math" aria-pressed="false">Math</button>
        <button type="button" data-section="oi" aria-pressed="false">OI</button>
        <button type="button" data-section="science" aria-pressed="false">Science</button>
        <button type="button" data-section="puzzle" aria-pressed="false">Puzzle</button>
        <button type="button" data-section="testing" aria-pressed="false">Testing</button>
      </div>

      <section id="problem-section" class="problem-section" hidden>
        <div class="problem-group-head">
          <h2 id="problem-section-title"></h2>
          <div class="problem-group-actions">
            <button id="problem-select-toggle" type="button">Select</button>
            <button class="add-problem" id="add-problem" type="button">Add problem</button>
            <button class="add-problem" id="batch-add-problem" type="button">Batch add</button>
          </div>
        </div>

        <div class="problem-toolbar">
          <label class="problem-search">Search <input id="problem-search" type="search" placeholder="Tag, text, index…" /></label>
          <div class="kind-choices" id="problem-difficulty-filter" role="group" aria-label="Difficulty">
            <button type="button" data-problem-difficulty-filter="all" aria-pressed="true">All</button>
            <button type="button" data-problem-difficulty-filter="easy" aria-pressed="false">Easy</button>
            <button type="button" data-problem-difficulty-filter="normal" aria-pressed="false">Normal</button>
            <button type="button" data-problem-difficulty-filter="hard" aria-pressed="false">Hard</button>
            <button type="button" data-problem-difficulty-filter="insane" aria-pressed="false">Insane</button>
          </div>
          <label class="problem-sort">Sort
            <select id="problem-sort">
              <option value="index">Index ↑</option>
              <option value="index-desc">Index ↓</option>
              <option value="difficulty">Difficulty</option>
            </select>
          </label>
          <p id="problem-count" class="field-note"></p>
        </div>

        <div class="problem-bulk" id="problem-bulk" hidden>
          <label class="problem-check"><input type="checkbox" id="problem-select-page" /> This page</label>
          <label class="problem-check"><input type="checkbox" id="problem-select-all" /> <span id="problem-select-all-label">All</span></label>
          <span id="problem-selected-count" class="field-note">None selected</span>
          <div class="kind-choices" id="problem-bulk-difficulty" role="group" aria-label="Set difficulty">
            <button type="button" data-bulk-difficulty="easy">Easy</button>
            <button type="button" data-bulk-difficulty="normal">Normal</button>
            <button type="button" data-bulk-difficulty="hard">Hard</button>
            <button type="button" data-bulk-difficulty="insane">Insane</button>
          </div>
          <button class="add-problem" id="problem-bulk-export" type="button">Export text</button>
          <button class="delete-map" id="problem-bulk-delete" type="button">Delete selected</button>
        </div>

        <div id="problem-pages" class="problem-pages" hidden></div>
        <p id="problem-empty" class="field-note" hidden></p>
        <ul id="problem-list" class="problem-list" hidden></ul>
      </section>
    </main>
  </div>
  <div id="page-toast" class="page-toast" role="status" aria-live="polite" hidden>
    <p id="page-toast-message"></p>
    <button id="page-toast-close" type="button">Close</button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
  <script type="module" src="/app/admin-problems.js"></script>
</body>
</html>
