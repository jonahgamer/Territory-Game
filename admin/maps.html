<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maps · Territory Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" />
</head>
<body>
  <div class="app">
    <header class="mobile-bar">
      <a id="mobile-home" class="brand mobile-logo" href="/admin/maps.html">Puzzle Territory</a>
      <button id="menu-button" class="menu-button" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
        <span class="menu-bars" aria-hidden="true"></span>Menu
      </button>
    </header>
    <aside class="sidebar">
      <a class="brand" id="home-button" href="/admin/maps.html">Puzzle Territory</a>
      <nav id="site-nav" aria-label="Sections"><ul id="nav-list"></ul></nav>
      <div class="account">
        <img id="account-pfp" class="account-pfp" alt="" hidden />
        <p id="account-name" hidden></p>
        <button id="account-button" type="button">Log out</button>
        <p id="account-role"></p>
      </div>
    </aside>
    <button class="sidebar-backdrop" type="button" aria-label="Close menu" hidden></button>
    <main>
      <p id="load-error" class="form-error" hidden></p>
      <p class="eyebrow">Admin</p>
      <h1>Maps</h1>
      <p class="lead">Create maps, paint problems, obstacles, and spawn points.</p>

      <div class="kind-choices" id="map-mode-choices" role="group" aria-label="Map mode">
        <button type="button" data-map-mode="official" aria-pressed="true">Official</button>
        <button type="button" data-map-mode="testing" aria-pressed="false">Testing</button>
      </div>

      <form id="create-map-form" class="create-map">
        <label>Name <input id="map-name" type="text" maxlength="60" required /></label>
        <label>Width <input id="map-cols" type="number" min="1" max="40" value="8" required /></label>
        <label>Height <input id="map-rows" type="number" min="1" max="40" value="8" required /></label>
        <button type="submit">Create map</button>
        <p id="map-form-error" class="form-error" hidden></p>
      </form>

      <p id="map-empty">No maps yet.</p>
      <ul id="map-list" class="map-list" hidden></ul>
    </main>
  </div>
  <div id="page-toast" class="page-toast" role="status" aria-live="polite" hidden>
    <p id="page-toast-message"></p>
    <button id="page-toast-close" type="button">Close</button>
  </div>
  <script type="module" src="/app/admin-maps.js?v=roles"></script>
</body>
</html>
