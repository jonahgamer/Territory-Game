<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Difficulty view · Territory Game</title>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get("map") || params.get("id") || "";
    const next = new URLSearchParams();
    if (id) next.set("map", id);
    next.set("view", "difficulty");
    location.replace(`/admin/map-editor.html?${next.toString()}`);
  </script>
</head>
<body></body>
</html>
