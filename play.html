<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play · Territory Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css?v=teleport-links" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" crossorigin="anonymous" />
</head>
<body>
  <div class="app">
    <header class="mobile-bar">
      <a id="mobile-home" class="brand mobile-logo" href="/index.html">Puzzle Territory</a>
      <button id="back-to-top" class="back-to-top" type="button" aria-label="Back to top" title="Back to top">
        <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
      </button>
      <button id="menu-button" class="menu-button" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
        <span class="menu-bars" aria-hidden="true"></span>Menu
      </button>
    </header>
    <aside class="sidebar">
      <div class="brand-row">
        <a class="brand" id="home-button" href="/index.html">Puzzle Territory</a>
        <button id="back-to-top-desktop" class="back-to-top" type="button" aria-label="Back to top" title="Back to top">
          <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
        </button>
      </div>
      <nav id="site-nav" aria-label="Sections"><ul id="nav-list"></ul></nav>
      <div class="account">
        <img id="account-pfp" class="account-pfp" alt="" hidden />
        <p id="account-name" hidden></p>
        <button id="account-button" type="button">Log out</button>
        <p id="account-role"></p>
      </div>
    </aside>
    <button class="sidebar-backdrop" type="button" aria-label="Close menu" hidden></button>
    <main>
      <p id="load-error" class="form-error" hidden></p>
      <div class="editor-toolbar">
        <a class="back-button" href="/index.html">Back to contests</a>
      </div>
      <p class="eyebrow">Contest</p>
      <h1 id="student-play-title"></h1>
      <p id="student-countdown" class="countdown" hidden></p>
      <p id="student-play-meta" class="lead"></p>

      <section id="spawn-agreement" class="spawn-agreement" hidden>
        <h2>Spawn agreement</h2>
        <table class="team-member-table">
          <thead><tr><th>Member</th><th>Vote</th><th>Status</th></tr></thead>
          <tbody id="spawn-votes"></tbody>
        </table>
        <p id="spawn-agreement-note" class="field-note"></p>
      </section>

      <section id="team-roster" class="team-roster" hidden>
        <h2>Your team</h2>
        <table class="team-table">
          <thead><tr><th>Team</th><th>Members</th><th>Spawn point</th></tr></thead>
          <tbody id="team-roster-body"></tbody>
        </table>
      </section>

      <p id="student-spawn-note" class="field-note" hidden></p>
      <p id="student-joined" class="field-note" hidden></p>
      <p id="student-team-summary" class="field-note" hidden></p>
      <p id="student-energy" class="energy-readout" hidden></p>
      <div id="student-energy-track" class="energy-track" hidden><div id="student-energy-fill" class="energy-fill"></div></div>

      <h2 id="student-leaderboard-heading" hidden>Leaderboard</h2>
      <ol id="student-leaderboard" class="leaderboard" hidden></ol>

      <div id="student-board" class="student-board" hidden>
        <ul class="legend">
          <li><span class="swatch fill easy"></span>Easy</li>
          <li><span class="swatch fill normal"></span>Normal</li>
          <li><span class="swatch fill hard"></span>Hard</li>
          <li><span class="swatch fill insane"></span>Insane</li>
          <li><span class="swatch solved-sample"></span>Solved</li>
          <li><span class="swatch owned-sample"></span>Territory</li>
        </ul>
        <div id="student-maps"></div>
        <div id="cell-tooltip" class="cell-tooltip" role="tooltip" hidden></div>

        <article id="student-problem" class="student-problem" hidden>
          <div class="student-problem-card" role="dialog" aria-modal="true" aria-labelledby="student-problem-tag">
            <button id="student-problem-close" class="student-problem-close" type="button">Close</button>
            <h2 id="student-problem-tag"></h2>
            <div id="student-problem-prompt"></div>
            <form id="student-answer-form" hidden>
              <label>Answer <input id="student-answer" type="text" maxlength="5000" /></label>
              <button type="submit">Submit</button>
              <p id="student-energy-block" class="form-error" hidden></p>
              <p id="student-answer-error" class="form-error" hidden></p>
            </form>
            <p id="student-answer-success" class="status-note" hidden></p>
          </div>
        </article>
      </div>
    </main>
  </div>
  <div id="page-toast" class="page-toast" role="status" aria-live="polite" hidden>
    <p id="page-toast-message"></p>
    <button id="page-toast-close" type="button">Close</button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
  <script type="module" src="/app/student-play.js?v=energy-fix"></script>
</body>
</html>
